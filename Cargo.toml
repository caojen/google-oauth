[package]
name = "google-oauth"
version = "1.11.4"
edition = "2021"
description = "Google oauth server-side client"
license = "MIT"
repository = "https://github.com/caojen/google-oauth"
resolver = "1"
keywords = [
    "google",
    "oauth2"
]
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
anyhow = { version = "1" }
reqwest = { version = "0.12", default-features = false }
lazy_static = { version = "1" }
base64 = { version = "0.22" }
rsa = { version = "0.9.9", features = ["sha2"] }
log = { version = "0.4" }
async-lock = { version = "3.4" }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-time = { version = "1", optional = true }
# wasm dependencies
sha256 = { version = "1", default-features = false }
hex = { version = "0.4" }
getrandom = { version = "0.3", features = ["js"] }

[features]
default = ["reqwest/default-tls"]
blocking = ["reqwest/blocking"]
wasm = ["dep:wasm-bindgen-futures", "dep:wasm-bindgen", "dep:web-time"]
reqwest-rustls = ["reqwest/rustls-tls"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
crate-type = ["cdylib", "rlib"]
